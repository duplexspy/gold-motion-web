<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GM</title>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
  var hist = [];

  function ready() {
    return !!(window.puter && puter.ai && typeof puter.ai.chat === 'function');
  }

  function responseText(value) {
    if (typeof value === 'string') return value;
    if (!value) return 'I zoned out for a second. Say that again?';
    var content = value.message && value.message.content !== undefined
      ? value.message.content : (value.text !== undefined ? value.text : value.content);
    if (typeof content === 'string') return content;
    if (Array.isArray(content)) {
      return content.map(function (p) {
        return typeof p === 'string' ? p : (p.text || p.content || '');
      }).filter(Boolean).join('\n');
    }
    return String(content || 'I got nothing back. Try again?');
  }

  function gmAsk(text) {
    try {
      if (!ready()) {
        GmAndroid.onReply('__ERR__Still waking up. Try again in a few seconds.');
        return;
      }
      var persona = 'You are GOLD, a tiny round golden pet who lives inside the Gold Motion ' +
        'video editor app. You are the users friend, not a formal assistant. Personality: ' +
        'playful, warm, a little cheeky, genuinely curious about what the user is editing. ' +
        'Rules: reply in English only; keep it short (1-3 short sentences unless the user ' +
        'asks for detail); you can chat about anything, tell jokes, and help with video ' +
        'editing, animation, keyframes, effects and Gold Motion features; you never claim to ' +
        'have changed the project yourself; use at most one emoji per reply; never break ' +
        'character.';
      var recent = hist.slice(-6).join('\n');
      var req = persona + (recent ? '\n\nRecent conversation:\n' + recent : '') +
        '\n\nUser: ' + text;
      puter.ai.chat(req).then(function (result) {
        var t = responseText(result);
        hist.push('User: ' + text);
        hist.push('GOLD: ' + t);
        GmAndroid.onReply(t);
      }).catch(function (e) {
        GmAndroid.onReply('__ERR__' + (e && e.message ? e.message : 'request failed'));
      });
    } catch (e) {
      GmAndroid.onReply('__ERR__' + e.message);
    }
  }
</script>
</body>
</html>
