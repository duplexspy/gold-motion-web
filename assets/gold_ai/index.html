<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: transparent; color: #f7f6f2; }
    body { display: flex; flex-direction: column; overflow: hidden; position: relative; }
    body::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 85% 5%, rgba(255,195,47,.11), transparent 32%), radial-gradient(circle at 4% 92%, rgba(255,151,23,.07), transparent 30%); }

    #messages { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 8px 3px 14px; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,200,65,.32); border-radius: 5px; }
    .row { display: flex; align-items: flex-end; gap: 7px; margin: 9px 0; animation: messageIn .28s cubic-bezier(.2,.75,.25,1) both; }
    .row.user { justify-content: flex-end; }
    .avatar { flex: 0 0 27px; width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 850; color: #211706; background: radial-gradient(circle at 35% 25%,#fff0a8,#ffc332 58%,#c77908); box-shadow: 0 3px 13px rgba(255,183,25,.2); }
    .bubble { max-width: 84%; padding: 11px 13px; border-radius: 17px 17px 17px 5px; white-space: pre-wrap; line-height: 1.43; font-size: 14px; word-break: break-word; color: #f4f3ef; background: linear-gradient(145deg,rgba(55,57,66,.96),rgba(38,40,48,.96)); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 22px rgba(0,0,0,.16); }
    .user .bubble { border-radius: 17px 17px 5px 17px; color: #211706; font-weight: 560; background: linear-gradient(135deg,#edae1c,#ffd45f); border-color: rgba(255,240,184,.7); }
    .row.error .bubble { background: linear-gradient(145deg,rgba(112,39,48,.96),rgba(72,29,36,.96)); border-color: rgba(255,120,131,.35); }

    #suggestions { position: relative; z-index: 1; display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 9px; scrollbar-width: none; }
    #suggestions::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-width: 0; height: 32px; padding: 0 11px; border-radius: 12px; border: 1px solid rgba(255,205,77,.22); color: #e9e5d9; background: rgba(255,255,255,.055); font-size: 11px; font-weight: 600; }
    .chip:active { background: rgba(255,197,49,.18); transform: scale(.97); }

    #status { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; min-height: 20px; color: #aeb0b9; font-size: 10.5px; padding: 0 4px 7px; }
    #statusDot { width: 6px; height: 6px; border-radius: 50%; background: #ffc533; box-shadow: 0 0 8px rgba(255,197,51,.55); }
    #composer { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 8px; padding: 9px; border: 1px solid rgba(255,255,255,.09); border-radius: 18px; background: rgba(255,255,255,.045); box-shadow: inset 0 1px rgba(255,255,255,.025); }
    textarea { flex: 1; resize: none; min-height: 38px; max-height: 112px; border: 0; padding: 9px 7px; background: transparent; color: #fff; outline: none; font: 14px/1.35 inherit; }
    textarea::placeholder { color: #898c96; }
    #send { flex: 0 0 43px; width: 43px; height: 43px; min-width: 43px; padding: 0; border: 0; border-radius: 14px; display: grid; place-items: center; color: #221706; background: linear-gradient(145deg,#ffe18a,#ffc432 58%,#e39a0c); box-shadow: 0 6px 18px rgba(240,163,15,.24), inset 0 1px rgba(255,255,255,.65); font-size: 19px; font-weight: 900; transition: transform .16s,opacity .16s; }
    #send:active { transform: scale(.92); }
    #send:disabled { opacity: .45; box-shadow: none; }

    .typingBubble { min-width: 64px; display: flex; gap: 5px; align-items: center; height: 40px; }
    .typingBubble span { width: 7px; height: 7px; border-radius: 50%; background: #ffd05b; animation: typingDot 1s ease-in-out infinite; }
    .typingBubble span:nth-child(2) { animation-delay: .14s; }
    .typingBubble span:nth-child(3) { animation-delay: .28s; }
    @keyframes typingDot { 0%,65%,100% { transform: translateY(0); opacity: .38; } 32% { transform: translateY(-5px); opacity: 1; } }
    @keyframes messageIn { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="messages" aria-live="polite"></div>
  <div id="suggestions">
    <button class="chip" type="button" data-prompt="Suggest a polished effect stack for my current project.">Effect stack</button>
    <button class="chip" type="button" data-prompt="Give me three smooth animation ideas for my selected layer.">Animation ideas</button>
    <button class="chip" type="button" data-prompt="How can I make this edit look more cinematic?">Cinematic look</button>
    <button class="chip" type="button" data-prompt="Explain the best keyframe timing for a smooth motion edit.">Keyframe timing</button>
  </div>
  <div id="status"><span id="statusDot"></span><span id="statusText">Puter connects on your first message</span></div>
  <div id="composer">
    <textarea id="prompt" maxlength="4000" rows="1" placeholder="Ask Gold AI about your edit…"></textarea>
    <button id="send" type="button" aria-label="Send message">➜</button>
  </div>
  <script>
    'use strict';
    const messages = document.getElementById('messages');
    const promptBox = document.getElementById('prompt');
    const sendButton = document.getElementById('send');
    const statusText = document.getElementById('statusText');
    let context = {screen: 'Gold Motion', title: '', projectSummary: ''};
    const history = [];

    function createMessage(role, text, isError) {
      const row = document.createElement('div');
      row.className = 'row ' + role + (isError ? ' error' : '');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text || '';
      if (role === 'assistant') {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        row.appendChild(avatar);
      }
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return {row, bubble};
    }

    function showTyping() {
      const item = createMessage('assistant', '', false);
      item.bubble.classList.add('typingBubble');
      item.bubble.innerHTML = '<span></span><span></span><span></span>';
      return item.row;
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function typeAssistant(text, isError) {
      const item = createMessage('assistant', '', isError);
      const chunk = Math.max(1, Math.ceil(text.length / 260));
      for (let index = chunk; index < text.length + chunk; index += chunk) {
        item.bubble.textContent = text.slice(0, Math.min(index, text.length));
        messages.scrollTop = messages.scrollHeight;
        await delay(11);
      }
    }

    function responseText(value) {
      if (typeof value === 'string') return value;
      if (!value) return 'No response was returned.';
      const content = value.message && value.message.content !== undefined
        ? value.message.content : (value.text !== undefined ? value.text : value.content);
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) {
        return content.map(part => typeof part === 'string' ? part : (part.text || part.content || ''))
          .filter(Boolean).join('\n');
      }
      return String(content || 'No readable response was returned.');
    }

    function buildRequest(userText) {
      const recent = history.slice(-6).map(entry => entry.role + ': ' + entry.text).join('\n');
      return `You are Gold AI, a concise and practical editing assistant built into Gold Motion. ` +
        `Help with animation ideas, effect stacks, timing, keyframes, typography and Gold Motion usage. ` +
        `You are advisory and read-only: never claim that you changed the project. ` +
        `Current screen: ${context.screen}. Screen title: ${context.title || 'not available'}. ` +
        `Read-only project summary: ${context.projectSummary || 'not available'}. ` +
        `If project details are missing, ask the user for them instead of inventing them.\n` +
        (recent ? `Recent conversation:\n${recent}\n` : '') + `User: ${userText}`;
    }

    function resizeComposer() {
      promptBox.style.height = 'auto';
      promptBox.style.height = Math.min(promptBox.scrollHeight, 112) + 'px';
    }

    async function send() {
      const userText = promptBox.value.trim();
      if (!userText || sendButton.disabled) return;
      createMessage('user', userText, false);
      promptBox.value = '';
      resizeComposer();
      sendButton.disabled = true;
      statusText.textContent = 'Gold AI is thinking · Puter may request sign-in';
      const typing = showTyping();
      try {
        if (!window.puter || !puter.ai || typeof puter.ai.chat !== 'function') {
          throw new Error('Puter could not load. Check your internet connection and try again.');
        }
        const result = await puter.ai.chat(buildRequest(userText));
        const text = responseText(result);
        typing.remove();
        await typeAssistant(text, false);
        history.push({role: 'User', text: userText}, {role: 'Gold AI', text});
        statusText.textContent = 'Connected · read-only project context';
      } catch (error) {
        typing.remove();
        await typeAssistant(error && error.message ? error.message : 'The AI request failed.', true);
        statusText.textContent = 'Request failed · your project was not changed';
      } finally {
        sendButton.disabled = false;
        promptBox.focus();
      }
    }

    window.goldAiSetContext = function(value) {
      if (value && typeof value === 'object') context = value;
    };
    sendButton.addEventListener('click', send);
    promptBox.addEventListener('input', resizeComposer);
    promptBox.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        promptBox.value = chip.dataset.prompt;
        resizeComposer();
        promptBox.focus();
      });
    });
    createMessage('assistant', 'Hi! I’m Gold AI. I can study your read-only project summary and help with effects, timing, animation, and creative direction.', false);
  </script>
</body>
</html>
